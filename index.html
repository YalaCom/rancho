<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAOBAND — РАНЧО</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        .graffiti {
            font-family: 'Press Start 2P', system-ui;
            text-shadow: 
                3px 3px 0 #fff,
                -3px -3px 0 #fff,
                3px -3px 0 #fff,
                -3px 3px 0 #fff;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(255,255,255,0.07) 2px,
                rgba(255,255,255,0.07) 4px
            );
            pointer-events: none;
            z-index: 50;
            animation: scan 4s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        .glitch {
            animation: glitch 0.4s infinite;
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        
        .vinyl {
            animation: spin 25s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-black text-white relative">
    <!-- Background particles -->
    <div id="particles" class="fixed inset-0 z-0"></div>

    <!-- Navbar (упрощённая) -->
    <nav class="fixed top-0 w-full z-50 border-b border-white/30 bg-black/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-5">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 border-2 border-white flex items-center justify-center text-xl rotate-12">C</div>
                <h1 class="text-3xl tracking-tighter graffiti">CAOBAND</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="px-6 py-2 border border-white hover:bg-white hover:text-black transition cursor-pointer text-sm tracking-widest">
                    05.06.2026
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="min-h-screen flex items-center relative pt-20">
        <div class="absolute inset-0 bg-[radial-gradient(at_center,#ffffff10_0%,transparent_70%)]"></div>
        
        <div class="max-w-7xl mx-auto px-8 grid grid-cols-2 gap-16 items-center z-10">
            <!-- Left -->
            <div class="space-y-8">
                <div class="inline-flex items-center gap-2 border border-white/50 px-5 py-2 text-sm tracking-widest">
                    <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    НОВЫЙ РЕЛИЗ
                </div>
                
                <h1 class="text-[9rem] leading-none font-black graffiti tracking-[-0.05em] glitch" style="font-size: 9rem; line-height: 0.8;">
                    РАНЧО
                </h1>
                
                <div class="flex items-center gap-6">
                    <div onclick="playTrack()" 
                         class="group cursor-pointer bg-white text-black px-10 py-6 text-3xl hover:scale-110 transition flex items-center gap-4">
                        <i class="fa-solid fa-play"></i>
                        <span class="tracking-widest">СЛУШАТЬ</span>
                    </div>
                    
                    <a href="https://vk.com/audio437256259_456239507_f6d059311d998be8ea" 
                       target="_blank"
                       class="border border-white/70 hover:border-white px-8 py-6 text-xl flex items-center gap-3 transition hover:bg-white/10">
                        <i class="fa-brands fa-vk"></i>
                        VK
                    </a>
                </div>
                
                <div class="text-2xl text-gray-400 max-w-md">
                    CAOBAND<br>
                    <span class="text-white">— ВЫХОДИТ ЗАВТРА —</span>
                </div>
            </div>
            
            <!-- Right - Visual -->
            <div class="relative flex justify-center">
                <div class="relative">
                    <!-- Vinyl -->
                    <div class="w-96 h-96 border-8 border-white rounded-full relative vinyl">
                        <div class="absolute inset-4 bg-black rounded-full border-4 border-white flex items-center justify-center">
                            <div class="w-40 h-40 bg-white rounded-full flex items-center justify-center">
                                <div class="w-6 h-6 bg-black rounded-full"></div>
                            </div>
                        </div>
                        <div class="absolute inset-0 flex items-center justify-center text-[180px] opacity-10">☠</div>
                    </div>
                    
                    <!-- Overlay text -->
                    <div class="absolute -top-8 -right-8 bg-black border-2 border-white px-8 py-3 text-4xl rotate-12 graffiti shadow-2xl">
                        CAO
                    </div>
                    
                    <div class="absolute -bottom-6 -left-12 bg-black border-2 border-white px-10 py-4 text-5xl -rotate-12 graffiti">
                        BAND
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="absolute bottom-12 left-1/2 -translate-x-1/2 flex gap-8 text-sm tracking-widest">
            <div class="flex items-center gap-2">
                <span class="block w-8 h-[1px] bg-white"></span>
                ТОЛЬКО ДЛЯ РЕАЛЬНЫХ
            </div>
            <div class="flex items-center gap-2">
                <span class="block w-8 h-[1px] bg-white"></span>
                2026
            </div>
        </div>
        
        <div class="scanlines"></div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-white/20 py-12">
        <div class="max-w-7xl mx-auto px-8 flex justify-between items-center text-sm text-gray-400">
            <div>© CAOBAND 2026 • ALL RIGHTS RESERVED</div>
            <div class="flex gap-6">
                <a href="#" class="hover:text-white">INSTAGRAM</a>
                <a href="#" class="hover:text-white">TG</a>
                <a href="#" class="hover:text-white">YOUTUBE</a>
            </div>
            <div class="text-xs">Сделано с уважением к улице</div>
        </div>
    </footer>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 80; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.opacity = Math.random() * 0.6 + 0.2;
                
                const duration = Math.random() * 20 + 15;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * -30}s`;
                
                container.appendChild(particle);
            }
        }
        
        function playTrack() {
            window.open("https://vk.com/audio437256259_456239507_f6d059311d998be8ea", "_blank");
        }
        
        window.onload = function() {
            createParticles();
            
            setInterval(() => {
                if (Math.random() > 0.7) {
                    const title = document.querySelector('h1');
                    title.classList.add('glitch');
                    setTimeout(() => title.classList.remove('glitch'), 600);
                }
            }, 4500);
        }
    </script>
</body>
</html>
