<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAOBAND — РАНЧО</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        
        body {
            font-family: 'VT323', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        .graffiti {
            font-family: 'Press Start 2P', system-ui;
            text-shadow: 
                3px 3px 0 #fff,
                -3px -3px 0 #fff,
                3px -3px 0 #fff,
                -3px 3px 0 #fff;
        }
        
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(255,255,255,0.07) 2px,
                rgba(255,255,255,0.07) 4px
            );
            pointer-events: none;
            z-index: 50;
            animation: scan 4s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        
        .glitch {
            animation: glitch 0.4s infinite;
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        
        .vinyl {
            animation: spin 25s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 4.5rem !important;
                line-height: 0.85 !important;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-black text-white relative">
    <!-- Background particles -->
    <div id="particles" class="fixed inset-0 z-0"></div>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 border-b border-white/30 bg-black/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 border-2 border-white flex items-center justify-center text-lg rotate-12">C</div>
                <h1 class="text-2xl tracking-tighter graffiti">CAOBAND</h1>
            </div>
            
            <div class="px-5 py-1.5 border border-white text-sm tracking-widest">
                05.06.2026
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="min-h-screen flex items-center relative pt-20 pb-12">
        <div class="absolute inset-0 bg-[radial-gradient(at_center,#ffffff10_0%,transparent_70%)]"></div>
        
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-16 items-center z-10">
            
            <!-- Left -->
            <div class="space-y-8 text-center md:text-left">
                <div class="inline-flex items-center gap-2 border border-white/50 px-5 py-2 text-sm tracking-widest mx-auto md:mx-0">
                    <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                    НОВЫЙ РЕЛИЗ
                </div>
                
                <h1 class="hero-title text-[4.5rem] md:text-[9rem] leading-none font-black graffiti tracking-[-0.05em] glitch">
                    РАНЧО
                </h1>
                
                <div class="flex flex-col sm:flex-row items-center gap-4 justify-center md:justify-start">
                    <div onclick="playTrack()" 
                         class="group cursor-pointer bg-white text-black px-10 py-6 text-2xl md:text-3xl hover:scale-110 transition flex items-center gap-4 w-full md:w-auto justify-center">
                        <i class="fa-solid fa-play"></i>
                        <span class="tracking-widest">СЛУШАТЬ</span>
                    </div>
                    
                    <a href="https://vk.com/audio437256259_456239507_f6d059311d998be8ea" 
                       target="_blank"
                       class="border border-white/70 hover:border-white px-8 py-6 text-xl flex items-center gap-3 transition hover:bg-white/10 w-full md:w-auto justify-center">
                        <i class="fa-brands fa-vk"></i>
                        VK
                    </a>
                </div>
                
                <div class="text-xl md:text-2xl text-gray-400">
                    CAOBAND<br>
                    <span class="text-white">— ВЫХОДИТ ЗАВТРА —</span>
                </div>
            </div>
            
            <!-- Right - Vinyl -->
            <div class="relative flex justify-center">
                <div class="relative">
                    <div class="w-72 h-72 md:w-96 md:h-96 border-8 border-white rounded-full relative vinyl">
                        <div class="absolute inset-4 bg-black rounded-full border-4 border-white flex items-center justify-center">
                            <div class="w-32 h-32 md:w-40 md:h-40 bg-white rounded-full flex items-center justify-center">
                                <div class="w-6 h-6 bg-black rounded-full"></div>
                            </div>
                        </div>
                        <div class="absolute inset-0 flex items-center justify-center text-[140px] md:text-[180px] opacity-10">☠</div>
                    </div>
                    
                    <!-- Overlay texts -->
                    <div class="absolute -top-6 -right-6 md:-top-8 md:-right-8 bg-black border-2 border-white px-6 py-2 md:px-8 md:py-3 text-3xl md:text-4xl rotate-12 graffiti shadow-2xl">
                        CAO
                    </div>
                    
                    <div class="absolute -bottom-6 -left-6 md:-bottom-6 md:-left-12 bg-black border-2 border-white px-8 py-3 md:px-10 md:py-4 text-4xl md:text-5xl -rotate-12 graffiti">
                        BAND
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col sm:flex-row items-center gap-4 md:gap-8 text-xs md:text-sm tracking-widest text-center">
            <div class="flex items-center gap-2">
                <span class="block w-6 h-[1px] bg-white"></span>
                ТОЛЬКО ДЛЯ РЕАЛЬНЫХ
            </div>
            <div class="flex items-center gap-2">
                <span class="block w-6 h-[1px] bg-white"></span>
                2026
            </div>
        </div>
        
        <div class="scanlines"></div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-white/20 py-10">
        <div class="max-w-7xl mx-auto px-6 text-center md:text-left">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 text-sm text-gray-400">
                <div>© CAOBAND 2026 • ALL RIGHTS RESERVED</div>
                <div class="flex gap-6">
                    <a href="#" class="hover:text-white">INSTAGRAM</a>
                    <a href="#" class="hover:text-white">TG</a>
                    <a href="#" class="hover:text-white">YOUTUBE</a>
                </div>
                <div class="text-xs">Сделано с уважением к улице</div>
            </div>
        </div>
    </footer>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            container.innerHTML = ''; // Clear previous
            for (let i = 0; i < 60; i++) {  // меньше частиц на мобильных
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 3.5 + 1.5;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.opacity = Math.random() * 0.5 + 0.15;
                
                const duration = Math.random() * 18 + 12;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * -25}s`;
                
                container.appendChild(particle);
            }
        }
        
        function playTrack() {
            window.open("https://vk.com/audio437256259_456239507_f6d059311d998be8ea", "_blank");
        }
        
        window.onload = function() {
            createParticles();
            
            // Random glitch
            setInterval(() => {
                if (Math.random() > 0.65) {
                    const title = document.querySelector('h1');
                    title.classList.add('glitch');
                    setTimeout(() => title.classList.remove('glitch'), 600);
                }
            }, 5000);
        };
    </script>
</body>
</html>
